name: Analyze upstream Stremio Tizen 4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-upstream.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patchrepo

      - name: Checkout Apps2Samsung package repository
        uses: actions/checkout@v4
        with:
          repository: Apps2Samsung/tizen-community-packages
          ref: main
          path: upstream

      - name: Extract exact upstream WGT
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/extracted patchrepo/analysis/upstream
          cp upstream/apps/Stremio.wgt work/Stremio.wgt
          sha256sum work/Stremio.wgt | tee patchrepo/analysis/UPSTREAM_SHA256.txt
          unzip -t work/Stremio.wgt | tee patchrepo/analysis/UNZIP_TEST.txt
          unzip -q work/Stremio.wgt -d work/extracted
          find work/extracted -type f -printf '%P\n' | sort | tee patchrepo/analysis/PACKAGE_FILES.txt

      - name: Locate and preserve actual package files
        shell: bash
        run: |
          set -euxo pipefail
          CONFIG="$(find work/extracted -type f -name config.xml -print -quit)"
          INDEX="$(find work/extracted -type f -name index.html -print -quit)"
          BUNDLE="$(find work/extracted -type f -name bundle.js -print -quit)"
          printf 'CONFIG=%s\nINDEX=%s\nBUNDLE=%s\n' "$CONFIG" "$INDEX" "$BUNDLE" | tee patchrepo/analysis/LOCATIONS.txt
          test -n "$CONFIG"
          test -n "$INDEX"
          test -n "$BUNDLE"
          cp "$CONFIG" patchrepo/analysis/upstream/config.xml
          cp "$INDEX" patchrepo/analysis/upstream/index.html
          cp "$BUNDLE" patchrepo/analysis/upstream/bundle.js

      - name: Generate code report
        shell: bash
        run: |
          set -uo pipefail
          BUNDLE="patchrepo/analysis/upstream/bundle.js"
          {
            echo "# Stremio Tizen 4 upstream analysis"
            echo
            echo "## Package SHA-256"
            cat patchrepo/analysis/UPSTREAM_SHA256.txt
            echo
            echo "## Compatibility-sensitive occurrences"
            for term in 'webapis.avplay' 'avplay' '127.0.0.1' '11470' '12470' 'hlsv2' '/tracks' 'mediaURL' 'streamingServer' 'streaming server' 'm3u8' 'language' 'locale' 'i18n'; do
              echo
              echo "### $term"
              grep -n -i -F "$term" "$BUNDLE" | head -n 100 || true
            done
            echo
            echo "## config.xml"
            cat patchrepo/analysis/upstream/config.xml
          } > patchrepo/analysis/REPORT.md

      - name: Commit analysis to main
        shell: bash
        working-directory: patchrepo
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis
          if git diff --cached --quiet; then
            echo "No analysis changes."
          else
            git commit -m "Analyze real Apps2Samsung Stremio Tizen 4 package"
            git push
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stremio-tizen4-analysis
          path: |
            work/
            patchrepo/analysis/
          if-no-files-found: warn
